<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>BOOOM‼️</title>
    <script>
      var repo = '/booom-hub';
      var path = window.location.pathname;
      var search = window.location.search;
      var hash = window.location.hash;

      if (path.indexOf(repo + '/') === 0) {
        var subpath = path.slice(repo.length);
        var newUrl = repo + '/?/' + subpath.slice(1).replace(/&/g, '~and~') +
          (search ? '&' + search.slice(1).replace(/&/g, '~and~') : '') + hash;
        window.location.replace(newUrl);
      } else {
        window.location.replace(repo + '/');
      }
    </script>
  </head>
  <body></body>
</html>
